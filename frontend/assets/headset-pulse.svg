<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pad-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12182A"/>
      <stop offset="50%" stop-color="#26324A"/>
      <stop offset="100%" stop-color="#12182A"/>
    </linearGradient>
  </defs>

  <!-- Fundo com iluminação controlada -->
  <rect width="400" height="300" fill="#0A0D18" rx="12"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>

  <!-- Tiara do Headset -->
  <path d="M 120 160 C 120 80, 280 80, 280 160" fill="none" stroke="#26324A" stroke-width="16" stroke-linecap="round"/>
  <path d="M 130 150 C 130 95, 270 95, 270 150" fill="none" stroke="url(#neon-cyan)" stroke-width="4" stroke-linecap="round"/>

  <!-- Almofada Superior -->
  <rect x="160" y="88" width="80" height="14" rx="7" fill="#12182A" stroke="#22D3EE" stroke-width="1"/>

  <!-- Conchas Auriculares (Earpads) -->
  <!-- Concha Esquerda -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="36" height="70" rx="18" fill="url(#pad-grad)" stroke="#26324A" stroke-width="2"/>
    <rect x="6" y="8" width="24" height="54" rx="12" fill="#0A0D18" stroke="#2563EB" stroke-width="2"/>
    <circle cx="18" cy="35" r="7" fill="#22D3EE" opacity="0.8"/>
  </g>

  <!-- Concha Direita -->
  <g transform="translate(264, 140)">
    <rect x="0" y="0" width="36" height="70" rx="18" fill="url(#pad-grad)" stroke="#26324A" stroke-width="2"/>
    <rect x="6" y="8" width="24" height="54" rx="12" fill="#0A0D18" stroke="#2563EB" stroke-width="2"/>
    <circle cx="18" cy="35" r="7" fill="#8B5CF6" opacity="0.8"/>
  </g>

  <!-- Microfone Gamer Retrátil -->
  <path d="M 115 195 Q 130 230 170 235" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
  <rect x="170" y="228" width="16" height="14" rx="5" fill="#2563EB"/>
  <circle cx="184" cy="235" r="3" fill="#22D3EE"/>

  <!-- Efeito de Som Pulse -->
  <path d="M 60 175 Q 80 150 60 125" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.4"/>
  <path d="M 340 175 Q 320 150 340 125" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
</svg>
