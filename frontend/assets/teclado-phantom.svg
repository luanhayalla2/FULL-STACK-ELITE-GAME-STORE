<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="glow-teclado" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rgb-strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#0A0D18" rx="12"/>
  <circle cx="200" cy="150" r="140" fill="url(#glow-teclado)"/>

  <!-- Chassi Mecânico em Alumínio Escovado -->
  <rect x="60" y="85" width="280" height="130" rx="10" fill="#12182A" stroke="#26324A" stroke-width="2"/>
  <rect x="64" y="89" width="272" height="6" rx="3" fill="url(#rgb-strip)" opacity="0.9"/>

  <!-- Fileiras de Teclas Mecânicas com Keycaps Customizadas -->
  <!-- Linha 1 -->
  <g fill="#1E293B" stroke="#26324A" stroke-width="1">
    <rect x="74" y="104" width="20" height="18" rx="3" fill="#2563EB" opacity="0.8"/>
    <rect x="98" y="104" width="20" height="18" rx="3"/>
    <rect x="122" y="104" width="20" height="18" rx="3"/>
    <rect x="146" y="104" width="20" height="18" rx="3"/>
    <rect x="170" y="104" width="20" height="18" rx="3"/>
    <rect x="194" y="104" width="20" height="18" rx="3"/>
    <rect x="218" y="104" width="20" height="18" rx="3"/>
    <rect x="242" y="104" width="20" height="18" rx="3"/>
    <rect x="266" y="104" width="20" height="18" rx="3"/>
    <rect x="290" y="104" width="36" height="18" rx="3"/>
  </g>

  <!-- Linha 2 -->
  <g fill="#1E293B" stroke="#26324A" stroke-width="1">
    <rect x="74" y="126" width="26" height="18" rx="3"/>
    <rect x="104" y="126" width="20" height="18" rx="3"/>
    <!-- Teclas W, A, S, D destacadas em ciano/roxo -->
    <rect x="128" y="126" width="20" height="18" rx="3" fill="#22D3EE" opacity="0.75"/>
    <rect x="152" y="126" width="20" height="18" rx="3"/>
    <rect x="176" y="126" width="20" height="18" rx="3"/>
    <rect x="200" y="126" width="20" height="18" rx="3"/>
    <rect x="224" y="126" width="20" height="18" rx="3"/>
    <rect x="248" y="126" width="20" height="18" rx="3"/>
    <rect x="272" y="126" width="20" height="18" rx="3"/>
    <rect x="296" y="126" width="30" height="18" rx="3"/>
  </g>

  <!-- Linha 3 -->
  <g fill="#1E293B" stroke="#26324A" stroke-width="1">
    <rect x="74" y="148" width="30" height="18" rx="3"/>
    <rect x="108" y="148" width="20" height="18" rx="3" fill="#8B5CF6" opacity="0.75"/>
    <rect x="132" y="148" width="20" height="18" rx="3" fill="#8B5CF6" opacity="0.75"/>
    <rect x="156" y="148" width="20" height="18" rx="3" fill="#8B5CF6" opacity="0.75"/>
    <rect x="180" y="148" width="20" height="18" rx="3"/>
    <rect x="204" y="148" width="20" height="18" rx="3"/>
    <rect x="228" y="148" width="20" height="18" rx="3"/>
    <rect x="252" y="148" width="20" height="18" rx="3"/>
    <rect x="276" y="148" width="50" height="18" rx="3" fill="#2563EB" opacity="0.8"/>
  </g>

  <!-- Linha 4 (Barra de Espaço) -->
  <g fill="#1E293B" stroke="#26324A" stroke-width="1">
    <rect x="74" y="170" width="36" height="18" rx="3"/>
    <rect x="114" y="170" width="24" height="18" rx="3"/>
    <rect x="142" y="170" width="116" height="18" rx="3" stroke="#22D3EE" stroke-width="1.5"/>
    <rect x="262" y="170" width="28" height="18" rx="3"/>
    <rect x="294" y="170" width="32" height="18" rx="3"/>
  </g>

  <!-- Iluminação subjacente (Underglow) -->
  <line x1="70" y1="210" x2="330" y2="210" stroke="url(#rgb-strip)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
