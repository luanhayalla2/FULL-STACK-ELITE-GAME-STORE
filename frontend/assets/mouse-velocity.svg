<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="glow-mouse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#0A0D18" rx="12"/>
  <circle cx="200" cy="150" r="130" fill="url(#glow-mouse)"/>

  <!-- Corpo Ergonômico do Mouse Gamer -->
  <path d="M 150 100 C 150 65, 250 65, 250 100 L 255 190 C 255 240, 145 240, 145 190 Z" 
        fill="url(#body-grad)" stroke="#26324A" stroke-width="2"/>

  <!-- Linha de divisão central -->
  <line x1="200" y1="75" x2="200" y2="140" stroke="#0A0D18" stroke-width="3"/>

  <!-- Scroll Wheel Gamer RGB -->
  <rect x="193" y="90" width="14" height="28" rx="7" fill="#0A0D18" stroke="#22D3EE" stroke-width="2"/>
  <line x1="193" y1="104" x2="207" y2="104" stroke="#22D3EE" stroke-width="2"/>

  <!-- Botão seletor de DPI -->
  <rect x="195" y="130" width="10" height="12" rx="3" fill="#2563EB"/>

  <!-- Fitas LED RGB Laterais -->
  <path d="M 152 110 C 150 150, 150 180, 155 210" fill="none" stroke="url(#neon-glow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 248 110 C 250 150, 250 180, 245 210" fill="none" stroke="url(#neon-glow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Logotipo da Palma Iluminado (Mira / Escudo) -->
  <polygon points="200,175 210,190 200,205 190,190" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="200" cy="190" r="2" fill="#8B5CF6"/>

  <!-- Linhas de velocidade de fundo -->
  <line x1="90" y1="120" x2="120" y2="120" stroke="#26324A" stroke-width="2" stroke-dasharray="4"/>
  <line x1="80" y1="150" x2="130" y2="150" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>
  <line x1="95" y1="180" x2="125" y2="180" stroke="#26324A" stroke-width="2" stroke-dasharray="4"/>

  <line x1="280" y1="120" x2="310" y2="120" stroke="#26324A" stroke-width="2" stroke-dasharray="4"/>
  <line x1="270" y1="150" x2="320" y2="150" stroke="#2563EB" stroke-width="2" opacity="0.6"/>
  <line x1="275" y1="180" x2="305" y2="180" stroke="#26324A" stroke-width="2" stroke-dasharray="4"/>
</svg>
